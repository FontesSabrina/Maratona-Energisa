[project]
name = "comunidades"
version = "0.1.0"
description = "Desafio 3: identifica as comunidades afetadas por desligamento programado (Leopoldina/MG)"
authors = [
    { name = "Luciano Filho", email = "lcn.filho1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "pyogrio>=0.13.0",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "shapely>=2.1.2",
    "unidecode>=1.4.0",
]

[project.scripts]
comunidades = "comunidades:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
